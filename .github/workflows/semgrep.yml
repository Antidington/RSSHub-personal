name: Semgrep

# https://semgrep.dev/docs/semgrep-ci/sample-ci-configs/#sample-github-actions-configuration-file
on:
    pull_request_target:
        branches:
            - master
    push:
        branches:
            - master
    schedule:
        # random HH:MM to avoid a load spike on GitHub Actions at 00:00
        - cron: 21 20 * * *

jobs:
    semgrep:
        name: Scan
        runs-on: ubuntu-latest
        container:
            image: returntocorp/semgrep
        if: (github.triggering_actor != 'dependabot[bot]')
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Scan with configured rules or Community Edition
              run: |
                  if [ -n "$SEMGREP_APP_TOKEN" ]; then
                    semgrep ci --no-suppress-errors --sarif --output semgrep.sarif
                  else
                    semgrep scan --config auto --metrics off --sarif --output semgrep.sarif
                  fi
              env:
                  SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
            - name: Upload SARIF file for GitHub Advanced Security Dashboard
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: semgrep.sarif
              if: success()
